<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kas Dept. Press</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 70vh;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: max-content;
            font-size: 11px;
        }
        th, td {
            padding: 5px 8px;
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
            white-space: nowrap;
        }
        
        thead th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 10;
            border-bottom: 2px solid #cbd5e1;
            font-weight: bold;
        }
        
        tbody th, thead th:first-child {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 11; 
            text-align: left;
            border-right: 2px solid #cbd5e1;
            font-weight: bold;
            max-width: 110px; 
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        thead th:first-child { z-index: 12; }
        tbody tr:hover th, tbody tr:hover td { background-color: #f1f5f9; }
        .empty-cell { background-color: #fafafa; }
        
        /* Hide scrollbar for year buttons */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans p-2 md:p-8 text-sm">

    <div class="max-w-6xl mx-auto">
        <!-- HEADER -->
        <div class="flex flex-col items-center mb-6 mt-4 gap-3">
            <img src="icon-192.png" alt="Logo" class="w-16 h-16 rounded-2xl shadow-sm">
            <div class="text-center">
                <h1 class="text-xl md:text-2xl font-bold text-gray-800">Laporan Transparansi</h1>
                <p class="text-xs text-gray-500 mt-1">Kas Dept. Press</p>
            </div>
        </div>

        <!-- REVISI: YEAR SELECTOR BUTTONS -->
        <div class="flex justify-center gap-2 mb-6 overflow-x-auto no-scrollbar py-1 px-4" id="year-buttons">
            <!-- Injected via JS -->
        </div>

        <!-- REVISI: SUMMARY CARDS -->
        <div class="grid grid-cols-2 gap-3 mb-6 px-2">
            <div class="bg-green-50 border border-green-200 rounded-xl p-3 text-center shadow-sm">
                <div class="text-[10px] text-green-600 font-bold uppercase mb-1"><i class="fa-solid fa-arrow-trend-up mr-1"></i>Total Pemasukan</div>
                <div class="text-sm md:text-lg font-bold text-green-700" id="share-total-pemasukan">Rp 0</div>
            </div>
            <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-center shadow-sm">
                <div class="text-[10px] text-red-600 font-bold uppercase mb-1"><i class="fa-solid fa-arrow-trend-down mr-1"></i>Total Pengeluaran</div>
                <div class="text-sm md:text-lg font-bold text-red-700" id="share-total-pengeluaran">Rp 0</div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-4 md:p-6 mb-6">
            <h2 class="text-md font-bold text-gray-800 mb-3"><i class="fa-solid fa-table text-blue-600 mr-2"></i>Rincian Iuran Anggota</h2>
            <div class="table-container shadow-inner bg-white">
                <table id="report-table">
                    <thead>
                        <tr id="table-header">
                            <th>Anggota</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="13" class="text-center py-8 text-gray-400 animate-pulse">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div class="mt-3 flex gap-3 text-[10px] text-gray-500 justify-center">
                <div class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 mr-1"></span> Lunas</div>
                <div class="flex items-center"><span class="w-2.5 h-2.5 rounded-full border border-gray-300 mr-1 bg-[#fafafa]"></span> Kosong</div>
            </div>
        </div>
        
        <!-- REVISI: PENGELUARAN LIST -->
        <div class="bg-white rounded-xl shadow-md p-4 md:p-6">
            <h2 class="text-md font-bold text-gray-800 mb-4"><i class="fa-solid fa-money-bill-transfer text-blue-600 mr-2"></i>Riwayat Kas Lainnya</h2>
            <div id="list-kas-body">
                <div class="text-center py-4 text-gray-400 animate-pulse text-xs">Memuat data...</div>
            </div>
        </div>
        
        <div class="text-center mt-6 mb-4 text-xs text-gray-400">
            Dibuat dengan Aplikasi PWA Kas Dept. Press
        </div>
    </div>

    <script>
        document.write('<script src="config.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    
    <script>
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        const formatNumber = (angka) => new Intl.NumberFormat('id-ID').format(angka);
        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        
        const currentYearObj = new Date().getFullYear();
        let selectedYear = currentYearObj;

        function renderYearButtons() {
            const container = document.getElementById('year-buttons');
            container.innerHTML = '';
            for(let y = currentYearObj - 1; y <= currentYearObj + 1; y++) {
                const isSelected = y === selectedYear;
                const btnClass = isSelected 
                    ? 'bg-blue-600 text-white shadow-md border-blue-600' 
                    : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50';
                
                container.innerHTML += `<button onclick="changeYear(${y})" class="px-5 py-2 rounded-full text-xs font-bold transition-all border ${btnClass}">${y}</button>`;
            }
        }

        function changeYear(y) {
            selectedYear = y;
            renderYearButtons();
            loadReport();
        }

        async function loadReport() {
            const tableHead = document.getElementById('table-header');
            const tableBody = document.getElementById('table-body');
            const listKasBody = document.getElementById('list-kas-body');
            
            tableBody.innerHTML = '<tr><td colspan="13" class="text-center py-8 text-gray-400">Memuat data...</td></tr>';
            listKasBody.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs">Memuat data...</div>';
            
            try {
                const namaBulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                tableHead.innerHTML = '<th>Anggota</th>';
                namaBulan.forEach(b => {
                    tableHead.innerHTML += `<th class="text-center bg-gray-50 text-gray-600">${b}</th>`;
                });

                const { data: allMembers } = await supabaseClient.from('karyawan').select('*').order('nama');
                const { data: iuranData } = await supabaseClient.from('iuran_bulanan').select('*').like('bulan_tahun', `${selectedYear}-%`);
                const { data: kasData } = await supabaseClient.from('kas_sosial')
                    .select('*')
                    .gte('tanggal', `${selectedYear}-01-01`)
                    .lte('tanggal', `${selectedYear}-12-31`)
                    .order('tanggal', { ascending: false });

                // HITUNG TOTAL SUMMARY
                let totalIuran = 0;
                let totalPemasukanLain = 0;
                let totalPengeluaran = 0;

                const iuranMap = {};
                (iuranData || []).forEach(i => {
                    const nom = parseFloat(i.nominal);
                    totalIuran += nom;
                    
                    const parts = i.bulan_tahun.split('-');
                    if(parts.length === 2 && parts[0] == selectedYear) {
                        const mIndex = parseInt(parts[1]) - 1;
                        if(!iuranMap[i.karyawan_id]) iuranMap[i.karyawan_id] = {};
                        iuranMap[i.karyawan_id][mIndex] = nom;
                    }
                });

                (kasData || []).forEach(k => {
                    const nom = parseFloat(k.nominal);
                    if(k.jenis === 'masuk') totalPemasukanLain += nom;
                    else totalPengeluaran += nom;
                });

                document.getElementById('share-total-pemasukan').innerText = formatRp(totalIuran + totalPemasukanLain);
                document.getElementById('share-total-pengeluaran').innerText = formatRp(totalPengeluaran);

                // TABEL IURAN
                tableBody.innerHTML = '';
                let colTotals = new Array(12).fill(0);

                if(allMembers && allMembers.length > 0) {
                    allMembers.forEach(m => {
                        let rowHtml = `<tr><th title="${m.nama}">${m.nama}</th>`;
                        
                        for(let i=0; i<12; i++) {
                            const hasPaid = iuranMap[m.id] && iuranMap[m.id][i];
                            if(hasPaid) {
                                const nom = parseFloat(iuranMap[m.id][i]);
                                rowHtml += `<td class="text-right text-blue-700 font-medium bg-blue-50/40">${formatNumber(nom)}</td>`;
                                colTotals[i] += nom;
                            } else {
                                rowHtml += `<td class="empty-cell"></td>`;
                            }
                        }
                        rowHtml += '</tr>';
                        tableBody.innerHTML += rowHtml;
                    });
                    
                    let totalRowHtml = `<tr class="bg-gray-100"><th class="text-blue-800 font-extrabold uppercase bg-gray-200 border-t-2 border-blue-200">TOTAL</th>`;
                    for(let i=0; i<12; i++) {
                        if(colTotals[i] > 0) {
                            totalRowHtml += `<td class="text-right text-blue-800 font-bold bg-gray-100 border-t-2 border-blue-200">${formatNumber(colTotals[i])}</td>`;
                        } else {
                            totalRowHtml += `<td class="text-center text-gray-400 font-medium bg-gray-100 border-t-2 border-blue-200">-</td>`;
                        }
                    }
                    totalRowHtml += `</tr>`;
                    tableBody.innerHTML += totalRowHtml;

                } else {
                    tableBody.innerHTML = '<tr><td colspan="13" class="text-center py-8">Tidak ada data anggota</td></tr>';
                }

                // REVISI LIST PENGELUARAN (Bukan Tabel agar nominal tidak terpotong)
                listKasBody.innerHTML = '';
                if(kasData && kasData.length > 0) {
                    kasData.forEach(k => {
                        const isMasuk = k.jenis === 'masuk';
                        const color = isMasuk ? 'text-green-600' : 'text-red-600';
                        const sign = isMasuk ? '+' : '-';
                        const borderColor = isMasuk ? 'border-green-400' : 'border-red-400';
                        const bgIcon = isMasuk ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600';
                        const icon = isMasuk ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
                            
                        listKasBody.innerHTML += `
                        <div class="bg-gray-50 p-3 rounded-lg flex justify-between items-center border-l-4 ${borderColor} mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full ${bgIcon} flex items-center justify-center text-xs shadow-sm shrink-0">
                                    <i class="fa-solid ${icon}"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-gray-700 text-xs md:text-sm leading-tight">${k.keterangan}</div>
                                    <div class="text-[10px] text-gray-500 mt-0.5">${k.tanggal}</div>
                                </div>
                            </div>
                            <div class="font-bold ${color} text-xs md:text-sm whitespace-nowrap ml-2">
                                ${sign} ${formatRp(k.nominal)}
                            </div>
                        </div>`;
                    });
                } else {
                    listKasBody.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">Tidak ada catatan transaksi di tahun ini.</div>';
                }

            } catch (e) {
                console.error(e);
                tableBody.innerHTML = '<tr><td colspan="13" class="text-center py-8 text-red-500">Gagal memuat data</td></tr>';
            }
        }

        // Init
        renderYearButtons();
        loadReport();
    </script>
</body>
</html>
