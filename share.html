<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kas Dept. Press</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 75vh;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: max-content;
            font-size: 11px;
        }
        th, td {
            padding: 5px 8px;
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
            white-space: nowrap;
        }
        
        thead th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 10;
            border-bottom: 2px solid #cbd5e1;
            font-weight: bold;
        }
        
        tbody th, thead th:first-child {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 11; 
            text-align: left;
            border-right: 2px solid #cbd5e1;
            font-weight: bold;
            max-width: 110px; 
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        thead th:first-child { z-index: 12; }
        tbody tr:hover th, tbody tr:hover td { background-color: #f1f5f9; }
        .empty-cell { background-color: #fafafa; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans p-2 md:p-8 text-sm">

    <div class="max-w-6xl mx-auto">
        <!-- HEADER -->
        <div class="bg-blue-600 rounded-2xl shadow-lg p-6 mb-6 text-center text-white relative overflow-hidden">
            <div class="absolute -right-4 -top-4 opacity-10 text-7xl"><i class="fa-solid fa-coins"></i></div>
            <h2 class="text-blue-100 text-sm font-semibold mb-1">Total Saldo Kas Keseluruhan</h2>
            <div class="text-4xl font-bold tracking-tight mb-4" id="share-total-saldo">Rp 0</div>
            
            <div class="grid grid-cols-2 gap-4 border-t border-blue-500 pt-4 mt-2 cursor-pointer">
                <div class="hover:bg-blue-700/50 rounded-lg p-2 transition-colors" onclick="showPemasukanModal()">
                    <div class="text-[10px] text-blue-200 font-bold uppercase mb-1">Total Pemasukan <i class="fa-solid fa-circle-info ml-1"></i></div>
                    <div class="font-bold text-sm md:text-lg" id="share-total-masuk">Rp 0</div>
                </div>
                <div class="hover:bg-blue-700/50 rounded-lg p-2 transition-colors" onclick="showPengeluaranModal()">
                    <div class="text-[10px] text-red-300 font-bold uppercase mb-1">Total Pengeluaran <i class="fa-solid fa-circle-info ml-1"></i></div>
                    <div class="font-bold text-sm md:text-lg text-red-200" id="share-total-keluar">Rp 0</div>
                </div>
            </div>
        </div>

        <div class="flex justify-center gap-2 mb-6 overflow-x-auto no-scrollbar py-1 px-4" id="year-buttons">
            <!-- Injected via JS -->
        </div>

        <div class="bg-white rounded-xl shadow-md p-4 md:p-6 mb-6">
            <h2 class="text-md font-bold text-gray-800 mb-3"><i class="fa-solid fa-table text-blue-600 mr-2"></i>Rincian Iuran Anggota</h2>
            <div class="table-container shadow-inner bg-white">
                <table id="report-table">
                    <thead>
                        <tr id="table-header">
                            <th>Anggota</th>
                            <!-- Kolom Jan-Des -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="13" class="text-center py-8 text-gray-400 animate-pulse">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div class="mt-3 flex gap-3 text-[10px] text-gray-500 justify-center">
                <div class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 mr-1"></span> Lunas</div>
                <div class="flex items-center"><span class="w-2.5 h-2.5 rounded-full border border-gray-300 mr-1 bg-[#fafafa]"></span> Kosong</div>
            </div>
        </div>
        
        <div class="text-center mt-6 mb-4 text-xs text-gray-400">
            Dibuat dengan Aplikasi PWA Kas Dept. Press
        </div>
    </div>

    <!-- Modal Pemasukan -->
    <div id="modal-pemasukan" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 fade-in backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm max-h-[85vh] flex flex-col overflow-hidden">
            <div class="bg-green-50 p-4 border-b border-green-100 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-green-700"><i class="fa-solid fa-arrow-trend-up mr-2"></i>Rincian Pemasukan</h3>
                    <div class="text-xs text-green-500 mt-1">Total Keseluruhan</div>
                </div>
                <button onclick="closeModal('modal-pemasukan')" class="w-8 h-8 flex items-center justify-center rounded-full bg-green-100 text-green-600 hover:bg-green-200 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto bg-gray-50 space-y-3" id="list-pemasukan-content"></div>
        </div>
    </div>

    <!-- Modal Pengeluaran -->
    <div id="modal-pengeluaran" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 fade-in backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm max-h-[85vh] flex flex-col overflow-hidden">
            <div class="bg-red-50 p-4 border-b border-red-100 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-red-700"><i class="fa-solid fa-arrow-trend-down mr-2"></i>Rincian Pengeluaran</h3>
                    <div class="text-xs text-red-500 mt-1">Total Keseluruhan</div>
                </div>
                <button onclick="closeModal('modal-pengeluaran')" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-100 text-red-600 hover:bg-red-200 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto bg-gray-50 space-y-3" id="list-pengeluaran-content"></div>
        </div>
    </div>

    <script>
        document.write('<script src="config.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    
    <script>
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        const formatNumber = (angka) => new Intl.NumberFormat('id-ID').format(angka);
        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        
        const currentYearObj = new Date().getFullYear();
        let selectedYear = currentYearObj;
        
        let globalIuranBulananData = [];
        let globalKasMasukLainData = [];
        let globalKasKeluarData = [];

        function renderYearButtons() {
            const container = document.getElementById('year-buttons');
            container.innerHTML = '';
            for(let y = currentYearObj - 1; y <= currentYearObj + 1; y++) {
                const isSelected = y === selectedYear;
                const btnClass = isSelected 
                    ? 'bg-blue-600 text-white shadow-md border-blue-600' 
                    : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50';
                
                container.innerHTML += `<button onclick="changeYear(${y})" class="px-5 py-2 rounded-full text-xs font-bold transition-all border ${btnClass}">${y}</button>`;
            }
        }

        function changeYear(y) {
            selectedYear = y;
            renderYearButtons();
            loadReport();
        }

        function showPemasukanModal() {
            const listEl = document.getElementById('list-pemasukan-content');
            listEl.innerHTML = '';

            // Render Iuran Summary
            if (globalIuranBulananData.length > 0) {
                listEl.innerHTML += `<div class="font-bold text-gray-700 text-xs border-b pb-1 mb-2">IURAN ANGGOTA</div>`;
                globalIuranBulananData.forEach(i => {
                    listEl.innerHTML += `
                    <div class="bg-white p-3 rounded-lg shadow-sm mb-2 flex justify-between items-center border-l-4 border-green-400">
                        <div>
                            <div class="font-bold text-gray-700 text-sm">Iuran ${i.bulan}</div>
                        </div>
                        <div class="font-bold text-green-600 text-sm">+ ${formatRp(i.total)}</div>
                    </div>`;
                });
            }

            // Render Pemasukan Lain
            if (globalKasMasukLainData.length > 0) {
                listEl.innerHTML += `<div class="font-bold text-gray-700 text-xs border-b pb-1 mb-2 mt-4">PEMASUKAN LAINNYA</div>`;
                globalKasMasukLainData.forEach(k => {
                    listEl.innerHTML += `
                    <div class="bg-white p-3 rounded-lg shadow-sm mb-2 flex justify-between items-center border-l-4 border-green-400">
                        <div>
                            <div class="font-bold text-gray-700 text-sm">${k.keterangan}</div>
                            <div class="text-[10px] text-gray-500">${k.tanggal}</div>
                        </div>
                        <div class="font-bold text-green-600 text-sm">+ ${formatRp(k.nominal)}</div>
                    </div>`;
                });
            }

            if(globalIuranBulananData.length === 0 && globalKasMasukLainData.length === 0) {
                listEl.innerHTML = '<div class="text-center text-gray-500 py-8 text-xs">Belum ada pemasukan.</div>';
            }

            document.getElementById('modal-pemasukan').classList.remove('hidden');
        }

        function showPengeluaranModal() {
            const listEl = document.getElementById('list-pengeluaran-content');
            listEl.innerHTML = '';

            if (globalKasKeluarData.length > 0) {
                globalKasKeluarData.forEach(k => {
                    listEl.innerHTML += `
                    <div class="bg-white p-3 rounded-lg shadow-sm mb-2 flex justify-between items-center border-l-4 border-red-400">
                        <div>
                            <div class="font-bold text-gray-700 text-sm">${k.keterangan}</div>
                            <div class="text-[10px] text-gray-500">${k.tanggal}</div>
                        </div>
                        <div class="font-bold text-red-600 text-sm">- ${formatRp(k.nominal)}</div>
                    </div>`;
                });
            } else {
                listEl.innerHTML = '<div class="text-center text-gray-500 py-8 text-xs">Belum ada pengeluaran.</div>';
            }

            document.getElementById('modal-pengeluaran').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        async function loadReport() {
            const tableHead = document.getElementById('table-header');
            const tableBody = document.getElementById('table-body');
            
            tableBody.innerHTML = '<tr><td colspan="13" class="text-center py-8 text-gray-400">Memuat data...</td></tr>';
            
            try {
                const namaBulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                const namaBulanFull = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

                tableHead.innerHTML = '<th>Anggota</th>';
                namaBulan.forEach(b => {
                    tableHead.innerHTML += `<th class="text-center bg-gray-50 text-gray-600">${b}</th>`;
                });

                // Load Data ALL TIME untuk header atas
                const { data: allIuranData } = await supabaseClient.from('iuran_bulanan').select('*');
                const { data: allKasData } = await supabaseClient.from('kas_sosial').select('*').order('tanggal', { ascending: false });

                // Hitung Saldo Keseluruhan
                let grandTotalIuran = 0;
                globalIuranBulananData = []; // Reset
                
                // Kelompokkan Iuran Bulanan untuk Modal
                const iuranGrup = {};
                (allIuranData || []).forEach(i => {
                    const nom = parseFloat(i.nominal);
                    grandTotalIuran += nom;
                    
                    const [y, m] = i.bulan_tahun.split('-');
                    const namaBln = `${namaBulanFull[parseInt(m)-1]} ${y}`;
                    if(!iuranGrup[i.bulan_tahun]) iuranGrup[i.bulan_tahun] = { bulan: namaBln, total: 0, sortKey: i.bulan_tahun };
                    iuranGrup[i.bulan_tahun].total += nom;
                });
                
                globalIuranBulananData = Object.values(iuranGrup).sort((a,b) => b.sortKey.localeCompare(a.sortKey));

                let grandTotalKasMasuk = 0;
                let grandTotalKasKeluar = 0;
                globalKasMasukLainData = [];
                globalKasKeluarData = [];

                (allKasData || []).forEach(k => {
                    const nom = parseFloat(k.nominal);
                    if(k.jenis === 'masuk') {
                        grandTotalKasMasuk += nom;
                        globalKasMasukLainData.push(k);
                    } else {
                        grandTotalKasKeluar += nom;
                        globalKasKeluarData.push(k);
                    }
                });

                const finalTotalPemasukan = grandTotalIuran + grandTotalKasMasuk;
                const finalSaldo = finalTotalPemasukan - grandTotalKasKeluar;

                document.getElementById('share-total-saldo').innerText = formatRp(finalSaldo);
                document.getElementById('share-total-masuk').innerText = formatRp(finalTotalPemasukan);
                document.getElementById('share-total-keluar').innerText = formatRp(grandTotalKasKeluar);


                // LOAD DATA TABEL (Sesuai Tahun Terpilih)
                const { data: allMembers } = await supabaseClient.from('karyawan').select('*').order('nama');
                const iuranTahunIni = (allIuranData || []).filter(i => i.bulan_tahun.startsWith(selectedYear));

                const iuranMap = {};
                iuranTahunIni.forEach(i => {
                    const parts = i.bulan_tahun.split('-');
                    if(parts.length === 2) {
                        const mIndex = parseInt(parts[1]) - 1;
                        if(!iuranMap[i.karyawan_id]) iuranMap[i.karyawan_id] = {};
                        iuranMap[i.karyawan_id][mIndex] = i.nominal;
                    }
                });

                tableBody.innerHTML = '';
                let colTotals = new Array(12).fill(0);

                if(allMembers && allMembers.length > 0) {
                    allMembers.forEach(m => {
                        let rowHtml = `<tr><th title="${m.nama}">${m.nama}</th>`;
                        
                        for(let i=0; i<12; i++) {
                            const hasPaid = iuranMap[m.id] && iuranMap[m.id][i];
                            if(hasPaid) {
                                const nom = parseFloat(iuranMap[m.id][i]);
                                rowHtml += `<td class="text-right text-blue-700 font-medium bg-blue-50/40">${formatNumber(nom)}</td>`;
                                colTotals[i] += nom;
                            } else {
                                rowHtml += `<td class="empty-cell"></td>`;
                            }
                        }
                        rowHtml += '</tr>';
                        tableBody.innerHTML += rowHtml;
                    });
                    
                    let totalRowHtml = `<tr class="bg-gray-100"><th class="text-blue-800 font-extrabold uppercase bg-gray-200 border-t-2 border-blue-200">TOTAL</th>`;
                    for(let i=0; i<12; i++) {
                        if(colTotals[i] > 0) {
                            totalRowHtml += `<td class="text-right text-blue-800 font-bold bg-gray-100 border-t-2 border-blue-200">${formatNumber(colTotals[i])}</td>`;
                        } else {
                            totalRowHtml += `<td class="text-center text-gray-400 font-medium bg-gray-100 border-t-2 border-blue-200">-</td>`;
                        }
                    }
                    totalRowHtml += `</tr>`;
                    tableBody.innerHTML += totalRowHtml;

                } else {
                    tableBody.innerHTML = '<tr><td colspan="13" class="text-center py-8">Tidak ada data anggota</td></tr>';
                }

            } catch (e) {
                console.error(e);
                tableBody.innerHTML = '<tr><td colspan="13" class="text-center py-8 text-red-500">Gagal memuat data</td></tr>';
            }
        }

        renderYearButtons();
        loadReport();
    </script>
</body>
</html>
